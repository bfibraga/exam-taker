<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Runner</title>
<style>
  :root {
    color-scheme: light dark;

    --bg: #faf9f7;
    --surface: #ffffff;
    --surface-2: #f2f1ee;
    --ink: #1c1f1e;
    --muted: #5f6663;
    --line: #e4e2dd;
    --line-strong: #cfccc5;
    --brand: #004f65;
    --on-brand: #ffffff;
    --brand-soft: #e8f0f2;
    --focus: #0b6fa4;
    --good: #1c6b3c;
    --good-bg: #e4f2ea;
    --bad: #a4262c;
    --bad-bg: #fbeaeb;
    --warn-bg: #fdf3d8;
    --warn-ink: #6b5310;
    --shadow: 0 1px 2px rgba(28,31,30,.05), 0 1px 3px rgba(28,31,30,.04);

    --r: 10px;
    --r-sm: 6px;

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
    --s5: 24px; --s6: 32px; --s7: 48px;

    --t: 120ms;
  }

  /* Dark palette. Written twice on purpose:
     the media query handles the pre-paint window, the attribute block handles an
     explicit choice. Both selectors are specificity (0,2,0), so source order
     decides — the attribute block must come second. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171a;
      --surface: #1b1f23;
      --surface-2: #23282c;
      --ink: #e8e6e3;
      --muted: #9aa1a6;
      --line: #2c3237;
      --line-strong: #3d454b;
      --brand: #6fc3d6;
      --on-brand: #08222a;
      --brand-soft: #1d2b30;
      --focus: #5fb4d8;
      --good: #6fcf97;
      --good-bg: #1a2a21;
      --bad: #f08a8e;
      --bad-bg: #2b1d1e;
      --warn-bg: #2a2416;
      --warn-ink: #e2c877;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171a;
    --surface: #1b1f23;
    --surface-2: #23282c;
    --ink: #e8e6e3;
    --muted: #9aa1a6;
    --line: #2c3237;
    --line-strong: #3d454b;
    --brand: #6fc3d6;
    --on-brand: #08222a;
    --brand-soft: #1d2b30;
    --focus: #5fb4d8;
    --good: #6fcf97;
    --good-bg: #1a2a21;
    --bad: #f08a8e;
    --bad-bg: #2b1d1e;
    --warn-bg: #2a2416;
    --warn-ink: #e2c877;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  /* Focus is a first-class state here. The app had no focus styling at all. */
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ------------------------------------------------------------- chrome */

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: .85rem 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: var(--s4);
    align-items: center;
  }
  header h1 { font-size: 1rem; font-weight: 600; margin: 0; }

  nav { display: flex; gap: var(--s1); flex-wrap: wrap; }
  nav a {
    color: var(--muted);
    text-decoration: none;
    padding: .35rem .7rem;
    border-radius: var(--r-sm);
    transition: background var(--t), color var(--t);
  }
  nav a:hover { background: var(--surface-2); color: var(--ink); }
  nav a.active { color: var(--brand); background: var(--brand-soft); font-weight: 600; }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: var(--s3); }
  #theme-toggle { font-size: .85rem; }

  #timer {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    min-width: 3.5rem;
    text-align: right;
  }
  #timer.urgent { color: var(--bad); }

  main { max-width: 48rem; margin: 0 auto; padding: var(--s6) 1.5rem var(--s7); }

  footer {
    border-top: 1px solid var(--line);
    padding: var(--s4) 1.5rem;
    color: var(--muted);
    font-size: .85rem;
  }

  /* Exam bar. Static markup, outside <main>, so no route render can destroy it. */
  #exambar {
    background: var(--brand-soft);
    border-bottom: 1px solid var(--line);
    padding: .5rem 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: var(--s3);
    align-items: center;
    font-size: .9rem;
  }
  #exambar-clock { font-variant-numeric: tabular-nums; }
  #exambar .btn { margin-left: auto; }

  #notice {
    display: none;
    margin: 0;
    padding: .7rem 1.5rem;
    background: var(--warn-bg);
    color: var(--warn-ink);
  }
  #notice.show { display: block; }

  /* ------------------------------------------------------------ typography */

  h2 { font-size: 1.3rem; line-height: 1.3; font-weight: 600; margin: 0 0 var(--s3); }
  h3 { font-size: 1rem; line-height: 1.4; font-weight: 600; margin: var(--s5) 0 var(--s2); }

  .home-title { font-size: 1.5rem; line-height: 1.25; font-weight: 600; margin: 0; }
  .hint { color: var(--muted); font-size: .85rem; margin: var(--s1) 0 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ------------------------------------------------------------- controls */

  label { display: block; margin: var(--s4) 0 var(--s1); font-weight: 600; }
  input[type=number], input[type=text], select {
    font: inherit;
    padding: .45rem .55rem;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--ink);
    min-width: 8rem;
  }

  .btn {
    font: inherit;
    padding: .5rem 1rem;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: background var(--t), border-color var(--t), color var(--t);
  }
  .btn:hover:not(:disabled) { background: var(--surface-2); }
  .btn-primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  .btn-primary:hover:not(:disabled) { background: var(--brand); filter: brightness(1.08); }
  .btn-quiet { background: transparent; border-color: transparent; color: var(--muted); }
  .btn-quiet:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
  .btn:disabled { opacity: .5; cursor: default; }

  .row { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
  .row-end { justify-content: flex-end; margin-top: var(--s5); }

  /* --------------------------------------------------------------- pieces */

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    padding: var(--s4) var(--s5);
    margin: var(--s4) 0;
  }
  .card > :first-child { margin-top: 0; }
  .card > :last-child { margin-bottom: 0; }

  .pill { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .8rem; }
  .pill.ok { background: var(--good-bg); color: var(--good); }
  .pill.no { background: var(--bad-bg); color: var(--bad); }

  table { border-collapse: collapse; width: 100%; font-size: .95rem; }
  th, td { text-align: left; padding: .5rem; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }

  dialog {
    border: none;
    border-radius: var(--r);
    padding: var(--s5);
    max-width: 26rem;
    color: var(--ink);
    background: var(--surface);
    box-shadow: 0 12px 32px rgba(0,0,0,.28);
  }
  dialog::backdrop { background: rgba(20,23,26,.45); }

  /* Choice rows. The native input stays focusable at 1px and opacity 0 so it
     is still announced and still reachable; the row is what you see. */
  .stem { font-size: 1.15rem; line-height: 1.5; margin: var(--s4) 0 var(--s5); }
  .stem:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }

  #choices { display: flex; flex-direction: column; gap: var(--s2); }
  .choice {
    position: relative;
    display: flex;
    gap: .75rem;
    align-items: flex-start;
    padding: .7rem .85rem;
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background var(--t), border-color var(--t);
  }
  .choice input { position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0; }
  .choice .key {
    flex: 0 0 1.75rem;
    height: 1.75rem;
    display: grid;
    place-items: center;
    border-radius: var(--r-sm);
    background: var(--surface-2);
    color: var(--muted);
    font-weight: 600;
    font-size: .9rem;
    font-variant-numeric: tabular-nums;
  }
  .choice:hover { background: var(--surface-2); }
  .choice.is-on { background: var(--brand-soft); border-color: var(--brand); }
  .choice.is-on .key { background: var(--brand); color: var(--on-brand); }
  .choice:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }

  .choice-head {
    display: flex;
    flex-wrap: wrap;
    gap: var(--s3);
    align-items: baseline;
    justify-content: space-between;
  }
  #pick-count { margin: 0; }
  #key-help { margin: var(--s4) 0 0; }

  /* Palette. Kept as a wrapping row — restructuring it was declined. */
  .palette { display: flex; flex-wrap: wrap; gap: .35rem; margin: var(--s5) 0; }
  .palette button {
    position: relative;
    min-width: 2.25rem;
    padding: .3rem 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    color: var(--muted);
    font: inherit;
    font-size: .9rem;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .palette button.answered { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
  .palette button.current { outline: 2px solid var(--focus); outline-offset: 1px; color: var(--ink); font-weight: 700; }
  .palette button.flagged::after {
    content: "";
    position: absolute;
    top: 2px; right: 2px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--brand);
  }

  /* ------------------------------------------------------------ home cards */

  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--s3);
    margin: var(--s5) 0;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    padding: .85rem var(--s4);
  }
  .stat-label { color: var(--muted); font-size: .8rem; }
  .stat-value {
    font-size: 1.5rem;
    line-height: 1.1;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  @media (max-width: 34rem) {
    .stat-row { grid-template-columns: 1fr; }
  }

  .resume-line { color: var(--muted); font-size: .9rem; margin: 0; }

  /* -------------------------------------------------------------- results */

  .result-row { border-top: 1px solid var(--line); padding: var(--s4) 0; }
  .verdict { font-weight: 700; margin: 0; }
  .verdict.ok { color: var(--good); }
  .verdict.no { color: var(--bad); }
  .result-choices { margin: var(--s2) 0 0; padding-left: 1.25rem; }
  .result-choices li { margin: var(--s1) 0; }
  .result-choices li.right { color: var(--good); }
  .result-choices li.wrong { color: var(--bad); }
  .result-choices li.plain { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1 id="title">Exam Runner</h1>
  <nav id="nav"></nav>
  <div class="header-right">
    <button id="theme-toggle" class="btn btn-quiet" type="button" aria-label="Switch to dark theme">Dark</button>
    <span id="timer" role="timer" aria-label="Time remaining" hidden></span>
  </div>
</header>

<p id="notice" role="status"></p>

<div id="exambar" hidden>
  <span id="exambar-text">Attempt in progress</span>
  <span id="exambar-clock"></span>
  <button id="exambar-resume" class="btn" type="button">Resume</button>
</div>

<p id="clock-live" class="sr" aria-live="polite" aria-atomic="true"></p>

<main id="main">
  <p>Loading question bank&hellip;</p>
</main>

<footer>
  <span id="footer-note"></span>
</footer>

<dialog id="dlg"></dialog>

<!-- Present at all times: on file:// the fetch below fails and SN.Loader
     reads window.QUESTIONS instead. Over HTTP it loads harmlessly and is
     never consulted. -->
<script src="./questions.js"></script>

<script>
(function () {
  'use strict';

  var SN = {};
  window.SN = SN;

  // ---------------------------------------------------------------- Store

  SN.Store = (function () {
    var PREFIX = 'sn.';
    var memory = {};
    var available = (function () {
      try {
        var k = PREFIX + '__probe';
        window.localStorage.setItem(k, '1');
        window.localStorage.removeItem(k);
        return true;
      } catch (e) {
        return false;
      }
    })();

    function read(name) {
      if (available) {
        try { return window.localStorage.getItem(PREFIX + name); }
        catch (e) { return null; }
      }
      return Object.prototype.hasOwnProperty.call(memory, name) ? memory[name] : null;
    }

    function write(name, value) {
      if (available) {
        try { window.localStorage.setItem(PREFIX + name, value); return true; }
        catch (e) { available = false; }
      }
      memory[name] = value;
      return false;
    }

    function drop(name) {
      if (available) {
        try { window.localStorage.removeItem(PREFIX + name); } catch (e) {}
      }
      delete memory[name];
    }

    return {
      isPersistent: function () { return available; },
      getJSON: function (name) {
        var raw = read(name);
        if (raw === null) return null;
        try { return JSON.parse(raw); }
        catch (e) {
          drop(name);
          SN.UI.warn('Stored "' + name + '" was unreadable and has been reset.');
          return null;
        }
      },
      setJSON: function (name, value) { return write(name, JSON.stringify(value)); },
      drop: drop
    };
  })();

  // ------------------------------------------------------------------ Theme

  SN.Theme = (function () {
    var KEY = 'theme.v1';
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

    function stored() {
      var v = SN.Store.getJSON(KEY);
      return (v === 'dark' || v === 'light') ? v : null;
    }

    function system() { return (mq && mq.matches) ? 'dark' : 'light'; }
    function current() { return stored() || system(); }

    function apply(v) {
      var el = document.documentElement;
      el.setAttribute('data-theme', v);
      // Keeps form controls and scrollbars on the chosen theme rather than the
      // system one, which matters when the two disagree.
      el.style.colorScheme = v;
    }

    function paint() {
      var b = document.getElementById('theme-toggle');
      if (!b) return;
      var dark = current() === 'dark';
      b.textContent = dark ? 'Light' : 'Dark';
      b.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    }

    function onSystemChange(fn) {
      if (!mq) return;
      var handler = function () {
        // An explicit choice is never overridden by an OS change.
        if (!stored()) { apply(system()); fn(); }
      };
      if (typeof mq.addEventListener === 'function') mq.addEventListener('change', handler);
      else if (typeof mq.addListener === 'function') mq.addListener(handler);
    }

    function init() { apply(current()); paint(); }
    function toggle() {
      var next = current() === 'dark' ? 'light' : 'dark';
      SN.Store.setJSON(KEY, next);
      apply(next);
      paint();
      return next;
    }

    return { init: init, toggle: toggle, paint: paint, onSystemChange: onSystemChange };
  })();

  // --------------------------------------------------------------- Loader

  SN.Loader = (function () {
    var SOURCE = null;

    function isLocalFile() { return window.location.protocol === 'file:'; }

    function viaFetch() {
      if (typeof window.fetch !== 'function') return Promise.reject(new Error('no fetch'));
      return window.fetch('./questions.json', { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        });
    }

    function viaScript() {
      if (!window.QUESTIONS) throw new Error('questions.js did not load');
      return window.QUESTIONS;
    }

    function load() {
      // On file:// the browser refuses to serve a sibling file over fetch and
      // logs a CORS error the user cannot act on. Skipping the attempt avoids
      // a red console message on every load; window.QUESTIONS is already there.
      if (isLocalFile()) {
        SOURCE = 'questions.js';
        try { return Promise.resolve(viaScript()); }
        catch (e) { return Promise.reject(describe(e, null)); }
      }

      return viaFetch().then(function (bank) {
        SOURCE = 'questions.json';
        return bank;
      }).catch(function (err) {
        // Served over HTTP but the JSON is missing or unreadable. The wrapper
        // may still be present, so try it before giving up.
        try {
          SOURCE = 'questions.js';
          return viaScript();
        } catch (e2) {
          return Promise.reject(describe(e2, err));
        }
      });
    }

    function describe(scriptErr, fetchErr) {
      var lines = ['Could not read the question bank.', ''];
      if (fetchErr) lines.push('Tried fetch("./questions.json"): ' + fetchErr.message);
      lines.push('Tried window.QUESTIONS: ' + scriptErr.message);
      lines.push('');
      lines.push('Make sure questions.json and questions.js sit in the same folder');
      lines.push('as index.html, then regenerate them with:');
      lines.push('  node tools/convert.js');
      return new Error(lines.join('\n'));
    }

    return { load: load, source: function () { return SOURCE; } };
  })();

  // ------------------------------------------------------------- Settings

  SN.Settings = (function () {
    var KEY = 'exam.settings.v1';

    function defaults() {
      return {
        questionCount: SN.bank.exam.questionCount,
        durationMinutes: SN.bank.exam.durationMinutes,
        shuffle: true,
        passPercent: SN.bank.exam.passPercent
      };
    }

    function load() {
      var d = defaults();
      var saved = SN.Store.getJSON(KEY);
      if (!saved) return d;
      // Re-clamp: the bank may have shrunk since these were saved.
      return {
        questionCount: Math.min(Number(saved.questionCount) || d.questionCount, SN.bank.questions.length),
        durationMinutes: Number(saved.durationMinutes) || d.durationMinutes,
        shuffle: saved.shuffle !== false,
        passPercent: Number(saved.passPercent) || d.passPercent
      };
    }

    function save(s) { SN.Store.setJSON(KEY, s); }

    return { defaults: defaults, load: load, save: save };
  })();

  // ------------------------------------------------------------ Questions

  SN.Questions = (function () {
    // Built on first use, not at definition time: SN.bank is assigned by the
    // loader's promise, long after these IIFEs have run.
    var byId = null;

    function ensure() {
      if (byId) return;
      byId = {};
      SN.bank.questions.forEach(function (q) { byId[q.id] = q; });
    }

    function get(id) { ensure(); return byId[id]; }
    function all() { return SN.bank.questions; }
    function count() { return SN.bank.questions.length; }

    function draw(n, shuffle) {
      var pool = SN.bank.questions.slice();
      if (shuffle) {
        for (var i = pool.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
        }
      }
      return pool.slice(0, Math.min(n, pool.length)).map(function (q) { return q.id; });
    }

    return { get: get, all: all, count: count, draw: draw };
  })();

  // ---------------------------------------------------------- ExamSession

  SN.ExamSession = (function () {
    var KEY = 'exam.active.v1';
    var state = null;
    var timerHandle = null;
    var onTick = null;

    function blank() {
      return { ids: [], index: 0, picks: {}, flags: {}, startedAt: null, deadlineAt: null, settings: null };
    }

    function persist() { if (state) SN.Store.setJSON(KEY, state); }

    function start(settings) {
      var now = Date.now();
      state = {
        ids: SN.Questions.draw(settings.questionCount, settings.shuffle),
        index: 0,
        picks: {},
        flags: {},
        startedAt: now,
        deadlineAt: now + settings.durationMinutes * 60000,
        settings: settings
      };
      persist();
    }

    function restore() {
      var saved = SN.Store.getJSON(KEY);
      if (!saved || !Array.isArray(saved.ids) || !saved.ids.length) return false;
      var missing = saved.ids.filter(function (id) { return !SN.Questions.get(id); });
      if (missing.length) {
        // The bank changed underneath us. Drop it rather than render holes.
        SN.Store.drop(KEY);
        return false;
      }
      // Sessions written before the position was persisted have no index, and a
      // bank that shrank could leave a stale one past the end.
      var at = typeof saved.index === 'number' ? saved.index : 0;
      saved.index = Math.min(saved.ids.length - 1, Math.max(0, at));
      state = saved;
      return true;
    }

    function has() { return !!state; }
    function get() { return state; }

    function index() { return state ? state.index : 0; }

    function setIndex(i) {
      if (!state) return;
      var max = state.ids.length - 1;
      state.index = Math.min(max, Math.max(0, i));
      persist();
    }

    function currentId() { return state.ids[index()]; }
    function currentQuestion() { return SN.Questions.get(currentId()); }

    function picksFor(id) { return state.picks[id] || []; }
    function isFlagged(id) { return !!state.flags[id]; }

    function toggleFlag(id) {
      if (state.flags[id]) delete state.flags[id];
      else state.flags[id] = true;
      persist();
    }

    function answerCount() {
      return state.ids.filter(function (id) {
        return (state.picks[id] || []).length > 0;
      }).length;
    }

    function flagCount() {
      return state.ids.filter(function (id) { return state.flags[id]; }).length;
    }

    function remainingMs() {
      if (!state || !state.deadlineAt) return Infinity;
      return Math.max(0, state.deadlineAt - Date.now());
    }

    function submit(expired) {
      stopTimer();
      var result = SN.Scorer.score(state);
      result.expired = !!expired;
      result.durationMinutes = state.settings.durationMinutes;
      result.passPercent = state.settings.passPercent;
      SN.Store.drop(KEY);
      SN.Stats.record(result);
      SN.History.add(result);
      SN.lastResult = result;
      state = null;
      return result;
    }

    function startTimer(fn) {
      // Clear the previous interval first: stopTimer() also nulls onTick, so
      // assigning onTick before calling it would wipe the callback we just set.
      stopTimer();
      onTick = fn;
      timerHandle = setInterval(function () {
        if (onTick) onTick();
        if (remainingMs() <= 0) {
          stopTimer();
          if (state) {
            submit(true);
            SN.Router.go('results', 'expired');
          }
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
      onTick = null;
    }

    function setPick(id, letter) {
      var q = SN.Questions.get(id);
      if (!q) return;
      var cur = picksFor(id).slice();
      var at = cur.indexOf(letter);
      if (q.type === 'single') {
        cur = [letter];
      } else if (at === -1) {
        // Multi-select stops at the required count, which is what "Choose 3"
        // means. Unchecking first is the only way to swap a choice.
        if (cur.length >= q.correct.length) return;
        cur.push(letter);
      } else {
        cur.splice(at, 1);
      }
      // Keep picks in choice order so stored state is deterministic.
      // Scoring is order-insensitive; this is only about predictability.
      cur.sort(function (x, y) {
        return q.choices.findIndex(function (c) { return c.id === x; }) -
               q.choices.findIndex(function (c) { return c.id === y; });
      });
      state.picks[id] = cur;
      persist();
    }

    return {
      start: start, restore: restore, has: has, get: get,
      index: index, setIndex: setIndex,
      currentId: currentId, currentQuestion: currentQuestion,
      picksFor: picksFor, isFlagged: isFlagged, toggleFlag: toggleFlag,
      answerCount: answerCount, flagCount: flagCount,
      remainingMs: remainingMs, setPick: setPick,
      startTimer: startTimer, stopTimer: stopTimer, submit: submit
    };
  })();

  // --------------------------------------------------------------- Scorer

  SN.Scorer = (function () {
    function setsMatch(a, b) {
      if (a.length !== b.length) return false;
      var x = a.slice().sort();
      var y = b.slice().sort();
      for (var i = 0; i < x.length; i++) if (x[i] !== y[i]) return false;
      return true;
    }

    function score(state) {
      var rows = state.ids.map(function (id) {
        var q = SN.Questions.get(id);
        var picked = state.picks[id] || [];
        return {
          id: id,
          stem: q.stem,
          type: q.type,
          choices: q.choices,
          picked: picked,
          correct: q.correct,
          // Exact set match: order irrelevant, no partial credit, no penalty
          // for extra selections. This mirrors the real exam.
          isCorrect: setsMatch(picked, q.correct),
          flagged: !!state.flags[id]
        };
      });

      var correct = rows.filter(function (r) { return r.isCorrect; }).length;
      var total = rows.length;
      var percent = total ? (correct / total) * 100 : 0;

      return {
        rows: rows,
        correct: correct,
        incorrect: rows.filter(function (r) { return !r.isCorrect && r.picked.length; }).length,
        unanswered: rows.filter(function (r) { return r.picked.length === 0; }).length,
        total: total,
        percent: percent,
        at: Date.now()
      };
    }

    return { score: score, setsMatch: setsMatch };
  })();

  // -------------------------------------------------------------- History

  SN.History = (function () {
    var KEY = 'exam.history.v1';
    var CAP = 50;

    function all() { return SN.Store.getJSON(KEY) || []; }

    function add(result) {
      var list = all();
      list.unshift({
        at: result.at,
        total: result.total,
        correct: result.correct,
        percent: result.percent,
        passPercent: result.passPercent,
        durationMinutes: result.durationMinutes,
        expired: !!result.expired
      });
      while (list.length > CAP) list.pop();
      SN.Store.setJSON(KEY, list);
    }

    return { all: all, add: add };
  })();

  // ---------------------------------------------------------------- Stats

  SN.Stats = (function () {
    var KEY = 'exam.stats.v1';

    function all() { return SN.Store.getJSON(KEY) || {}; }

    function record(result) {
      var s = all();
      result.rows.forEach(function (row) {
        var e = s[row.id] || { seen: 0, correct: 0 };
        e.seen++;
        if (row.isCorrect) e.correct++;
        s[row.id] = e;
      });
      SN.Store.setJSON(KEY, s);
    }

    function clear() { SN.Store.drop(KEY); }

    function rows() {
      var s = all();
      return Object.keys(s).map(function (id) {
        return { id: id, seen: s[id].seen, correct: s[id].correct };
      }).sort(function (a, b) {
        return (a.correct / a.seen) - (b.correct / b.seen);
      });
    }

    return { all: all, record: record, clear: clear, rows: rows };
  })();

  // ------------------------------------------------------------------ UI

  SN.UI = (function () {
    var main = null;

    function warn(msg) {
      var el = document.getElementById('notice');
      if (!el) return;
      el.textContent = msg;
      el.className = 'show';
    }

    function clearWarn() {
      var el = document.getElementById('notice');
      if (el) { el.textContent = ''; el.className = ''; }
    }

    function render(html) {
      main.innerHTML = html;
      window.scrollTo(0, 0);
    }

    function escape(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    return {
      init: function () { main = document.getElementById('main'); },
      render: render,
      warn: warn,
      clearWarn: clearWarn,
      escape: escape
    };
  })();

  // --------------------------------------------------------------- Router

  SN.Router = (function () {
    var routes = {};
    var current = '';

    function parse() {
      // Handles '', '#', '#/', '#/setup', '#/results/expired', and any
      // trailing-slash or junk variant, always yielding a non-empty name.
      var h = window.location.hash.replace(/^#\/?/, '');
      var slash = h.indexOf('/');
      var name = (slash === -1 ? h : h.slice(0, slash)).trim();
      var arg = slash === -1 ? null : h.slice(slash + 1);
      return { name: name || 'home', arg: arg };
    }

    function go(name, arg) {
      window.location.hash = '#/' + name + (arg ? '/' + arg : '');
    }

    function run() {
      var r = parse();
      current = r.name;
      var fn = routes[r.name];
      if (!fn) { SN.UI.render('<h2>Not found</h2><p>No view named "' +
        SN.UI.escape(r.name) + '".</p>'); return; }
      fn(r.arg);
      // Repainted here, not only on the timer tick, so the clock and the exam
      // bar reflect the route that just rendered without waiting a second.
      // The typeof guard keeps this working before Task 7 defines syncExamBar.
      if (typeof syncExamBar === 'function') syncExamBar();
      paintClock();
      var links = document.querySelectorAll('#nav a');
      for (var i = 0; i < links.length; i++) {
        var on = links[i].getAttribute('href') === '#/' + r.name;
        links[i].className = on ? 'active' : '';
        if (on) links[i].setAttribute('aria-current', 'page');
        else links[i].removeAttribute('aria-current');
      }
    }

    return {
      add: function (name, fn) { routes[name] = fn; },
      go: go,
      run: run,
      start: function () {
        window.addEventListener('hashchange', run);
        run();
      },
      current: function () { return current; }
    };
  })();

// ---------------------------------------------------------------- Clock

  function fmtMs(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    return m + ':' + String(s % 60).padStart(2, '0');
  }

  var lastMark = null;

  function paintClock() {
    if (!SN.ExamSession.has()) {
      // remainingMs() is Infinity with no session, which formats as
      // "Infinity:NaN". Nothing is on the clock, so show nothing.
      var t = document.getElementById('timer');
      t.hidden = true;
      t.textContent = '';
      t.className = '';
      var idleBar = document.getElementById('exambar-clock');
      if (idleBar) idleBar.textContent = '';
      lastMark = null;
      return;
    }
    var ms = SN.ExamSession.remainingMs();
    var text = fmtMs(ms);

    var el = document.getElementById('timer');
    el.hidden = SN.Router.current() !== 'exam';
    el.textContent = text;
    el.className = ms <= 60000 ? 'urgent' : '';

    var bar = document.getElementById('exambar-clock');
    if (bar) bar.textContent = text;

    // Speak only at two thresholds. A live region updated once a second
    // re-announces the whole clock once a second.
    var secs = Math.floor(ms / 1000);
    var mark = secs <= 60 ? 60 : (secs <= 300 ? 300 : 0);
    if (mark && mark !== lastMark) {
      lastMark = mark;
      document.getElementById('clock-live').textContent =
        mark === 60 ? '1 minute remaining' : '5 minutes remaining';
    }
    if (!mark) lastMark = null;
  }

  // ----------------------------------------------------------------- boot

  // SN.view holds transient view state: which question is on screen, the
  // settings a fresh exam is about to start with, and the review filter.
  SN.view = { pendingSettings: null, reviewFilter: 'all' };

  SN.UI.init();

  if (!SN.Store.isPersistent()) {
    SN.UI.warn('This browser is blocking local storage, so nothing will be saved ' +
               'between visits. The exam still works for this session.');
  }

  SN.Loader.load().then(function (bank) {
    SN.bank = bank;
    document.getElementById('title').textContent = bank.exam.title;
    document.getElementById('footer-note').textContent =
      bank.questions.length + ' questions in this bank.';

    SN.Theme.init();
    document.getElementById('theme-toggle').addEventListener('click', function () {
      SN.Theme.toggle();
    });
    SN.Theme.onSystemChange(function () {
      SN.Theme.paint();
      if (typeof syncExamBar === 'function') syncExamBar();
    });

    var nav = document.getElementById('nav');
    nav.innerHTML = ['home', 'setup', 'history', 'stats']
      .map(function (n) {
        return '<a href="#/' + n + '">' + n.charAt(0).toUpperCase() + n.slice(1) + '</a>';
      }).join('');

    SN.Router.add('home', function () {
      SN.UI.render(
        '<h2>' + SN.UI.escape(SN.bank.exam.title) + '</h2>' +
        '<div class="card"><p>' + SN.bank.questions.length + ' questions loaded. ' +
        'Default exam: <strong>' + SN.bank.exam.questionCount + ' questions</strong>, ' +
        '<strong>' + SN.bank.exam.durationMinutes + ' minutes</strong>, pass at <strong>' +
        SN.bank.exam.passPercent + '%</strong>.</p>' +
        '<p><button class="btn btn-primary" id="go-setup">Start</button></p></div>'
      );
      document.getElementById('go-setup').addEventListener('click', function () {
        SN.Router.go('setup');
      });
    });

    SN.Router.add('exam', function () {
      // Set up by the setup screen.
      if (SN.view.pendingSettings) {
        SN.ExamSession.start(SN.view.pendingSettings);
        SN.view.pendingSettings = null;
      }
      if (!SN.ExamSession.has() && !SN.ExamSession.restore()) {
        SN.Router.go('setup');
        return;
      }
      SN.UI.clearWarn();
      renderExam();
    });


    function paletteCell(idx) {
      return document.querySelector('.palette button[data-i="' + idx + '"]');
    }

    // metaText and paletteLabel carry HTML entities, so they are written with
    // innerHTML. Both contain only counts and fixed words; everything derived
    // from the bank goes through SN.UI.escape here.
    function paletteLabel(st, idx) {
      var qid = st.ids[idx];
      return 'Question ' + (idx + 1) +
        ((st.picks[qid] || []).length ? ', answered' : ', not answered') +
        (st.flags[qid] ? ', flagged' : '');
    }

    function metaText() {
      return SN.ExamSession.answerCount() + ' answered &middot; ' +
        SN.ExamSession.flagCount() + ' flagged';
    }

    function pickCountText(q, n) {
      if (n < q.correct.length) {
        return 'Select ' + q.correct.length + ' &mdash; ' + n + ' of ' +
          q.correct.length + ' chosen';
      }
      return q.correct.length + ' of ' + q.correct.length +
        ' chosen &mdash; deselect one to swap';
    }

    function renderExam() {
      var st = SN.ExamSession.get();
      var i = SN.ExamSession.index();
      var q = SN.ExamSession.currentQuestion();
      var id = SN.ExamSession.currentId();
      var picked = SN.ExamSession.picksFor(id);
      var multi = q.type === 'multi';

      var choices = q.choices.map(function (c) {
        var on = picked.indexOf(c.id) !== -1;
        return '<label class="choice' + (on ? ' is-on' : '') + '" data-letter="' + c.id + '">' +
          '<input type="' + (multi ? 'checkbox' : 'radio') + '" name="pick" value="' + c.id + '"' +
          (on ? ' checked' : '') + '> ' +
          '<span class="key">' + SN.UI.escape(c.id) + '</span>' +
          '<span>' + SN.UI.escape(c.text) + '</span></label>';
      }).join('');

      var palette = st.ids.map(function (qid, idx) {
        var cls = [];
        if (idx === i) cls.push('current');
        if ((st.picks[qid] || []).length) cls.push('answered');
        if (st.flags[qid]) cls.push('flagged');
        return '<button class="' + cls.join(' ') + '" data-i="' + idx +
          '" aria-label="' + paletteLabel(st, idx) + '">' + (idx + 1) + '</button>';
      }).join('');

      SN.UI.render(
        '<h2 data-autofocus>Question ' + (i + 1) + ' of ' + st.ids.length + '</h2>' +
        '<p class="hint" id="exam-meta">' + metaText() + '</p>' +
        '<div class="stem" id="exam-stem">' + SN.UI.escape(q.stem) + '</div>' +
        '<div class="choice-head">' +
        (multi ? '<p class="hint" id="pick-count">' + pickCountText(q, picked.length) + '</p>' : '') +
        '<p class="hint" id="key-help">A&ndash;K pick &middot; &larr; &rarr; move ' +
        '&middot; F flag &middot; ? help</p>' +
        '</div>' +
        '<div id="choices">' + choices + '</div>' +
        '<div class="palette">' + palette + '</div>' +
        '<div class="row">' +
        '<button class="btn" id="prev" aria-keyshortcuts="ArrowLeft"' +
        (i === 0 ? ' disabled' : '') + '>Previous</button>' +
        '<button class="btn" id="next" aria-keyshortcuts="ArrowRight"' +
        (i === st.ids.length - 1 ? ' disabled' : '') + '>Next</button>' +
        '<button class="btn" id="flag" aria-keyshortcuts="F">' +
        (SN.ExamSession.isFlagged(id) ? 'Unflag' : 'Flag') + '</button>' +
        '<button class="btn btn-primary" id="submit" aria-keyshortcuts="Enter">Submit exam</button>' +
        '</div>'
      );

      Array.prototype.forEach.call(
        document.querySelectorAll('#choices input'),
        function (input) {
          input.addEventListener('change', function () { applyPick(input.value); });
        }
      );

      Array.prototype.forEach.call(
        document.querySelectorAll('.palette button'),
        function (b) {
          b.addEventListener('click', function () {
            SN.ExamSession.setIndex(parseInt(b.getAttribute('data-i'), 10));
            renderExam();
          });
        }
      );

      document.getElementById('prev').addEventListener('click', function () {
        SN.ExamSession.setIndex(i - 1); renderExam();
      });
      document.getElementById('next').addEventListener('click', function () {
        SN.ExamSession.setIndex(i + 1); renderExam();
      });
      document.getElementById('flag').addEventListener('click', function () { applyFlag(); });
      document.getElementById('submit').addEventListener('click', confirmSubmit);

      paintClock();
    }

    function applyPick(letter) {
      var st = SN.ExamSession.get();
      var i = SN.ExamSession.index();
      var id = SN.ExamSession.currentId();
      var q = SN.ExamSession.currentQuestion();

      SN.ExamSession.setPick(id, letter);

      // Re-derive from state rather than assuming the write landed: setPick
      // refuses a pick once a multi question is at its cap, and then nothing
      // below changes. That refusal is the intended behaviour.
      var picks = SN.ExamSession.picksFor(id);
      Array.prototype.forEach.call(
        document.querySelectorAll('#choices .choice'),
        function (row) {
          var lid = row.getAttribute('data-letter');
          var on = picks.indexOf(lid) !== -1;
          row.className = 'choice' + (on ? ' is-on' : '');
          row.querySelector('input').checked = on;
        }
      );

      var pc = document.getElementById('pick-count');
      if (pc) pc.innerHTML = pickCountText(q, picks.length);

      document.getElementById('exam-meta').innerHTML = metaText();

      var cell = paletteCell(i);
      if (cell) {
        if (picks.length) cell.classList.add('answered');
        else cell.classList.remove('answered');
        cell.setAttribute('aria-label', paletteLabel(st, i));
      }
    }

    function applyFlag() {
      var st = SN.ExamSession.get();
      var i = SN.ExamSession.index();
      var id = SN.ExamSession.currentId();

      SN.ExamSession.toggleFlag(id);

      document.getElementById('flag').textContent =
        SN.ExamSession.isFlagged(id) ? 'Unflag' : 'Flag';
      document.getElementById('exam-meta').innerHTML = metaText();

      var cell = paletteCell(i);
      if (cell) {
        if (SN.ExamSession.isFlagged(id)) cell.classList.add('flagged');
        else cell.classList.remove('flagged');
        cell.setAttribute('aria-label', paletteLabel(st, i));
      }
    }

    function confirmSubmit() {
      var st = SN.ExamSession.get();
      var unanswered = st.ids.length - SN.ExamSession.answerCount();
      var dlg = document.getElementById('dlg');
      dlg.innerHTML =
        '<h2>Submit this attempt?</h2>' +
        '<p>' + SN.ExamSession.answerCount() + ' of ' + st.ids.length + ' answered. ' +
        SN.ExamSession.flagCount() + ' flagged.</p>' +
        (unanswered > 0
          ? '<p><strong>' + unanswered + ' unanswered</strong> will be scored as incorrect.</p>'
          : '') +
        '<div class="row" style="justify-content:flex-end">' +
        '<button class="btn" id="dlg-no">Keep going</button>' +
        '<button class="btn btn-primary" id="dlg-yes">Submit</button></div>';
      dlg.showModal();
      dlg.querySelector('#dlg-no').addEventListener('click', function () { dlg.close(); });
      dlg.querySelector('#dlg-yes').addEventListener('click', function () {
        dlg.close();
        SN.ExamSession.submit(false);
        SN.Router.go('results');
      });
    }

    SN.Router.add('results', function (arg) {
      SN.ExamSession.stopTimer();
      document.getElementById('timer').hidden = true;

      var r = SN.lastResult;
      if (!r) { SN.Router.go('home'); return; }

      var passed = r.percent >= r.passPercent;
      var pct = r.percent.toFixed(1);

      var head = (arg === 'expired'
        ? '<div class="card" style="background:var(--bad-bg);color:var(--bad)">' +
          '<strong>Time expired.</strong> This attempt was submitted automatically.</div>'
        : '') +
        '<h2>' + (passed ? 'Passed' : 'Not passed') + '</h2>' +
        '<div class="card"><p style="font-size:1.6rem;margin:.2rem 0"><strong>' + pct +
        '%</strong> <span class="pill ' + (passed ? 'ok' : 'no') + '">pass mark ' +
        r.passPercent + '%</span></p>' +
        '<p>' + r.correct + ' correct of ' + r.total + ' &middot; ' +
        r.incorrect + ' incorrect &middot; ' + r.unanswered + ' unanswered</p>' +
        '<div class="row"><button class="btn btn-primary" id="again">Same settings</button>' +
        '<button class="btn" id="new-setup">Change settings</button>' +
        '<button class="btn" id="leave">Done</button></div></div>';

      var filter = SN.view.reviewFilter || 'all';
      var rows = r.rows.filter(function (row) {
        if (filter === 'wrong') return !row.isCorrect;
        if (filter === 'flagged') return row.flagged;
        return true;
      });

      var body = rows.map(function (row) {
        var choices = row.choices.map(function (c) {
          var picked = row.picked.indexOf(c.id) !== -1;
          var right = row.correct.indexOf(c.id) !== -1;
          var mark = right ? ' &#10003;' : (picked ? ' &#10007;' : '');
          return '<li>' + SN.UI.escape(c.text) + mark +
            (right ? ' <span class="hint">(correct)</span>' : '') +
            (picked && !right ? ' <span class="hint">(you picked this)</span>' : '') + '</li>';
        }).join('');

        return '<div class="result-row">' +
          '<p class="verdict ' + (row.isCorrect ? 'ok' : 'no') + '">' +
          (row.isCorrect ? 'Correct' : 'Incorrect') + '</p>' +
          '<p>' + SN.UI.escape(row.stem) + '</p>' +
          '<ul>' + choices + '</ul></div>';
      }).join('');

      SN.UI.render(head +
        '<div class="row" style="margin:1.5rem 0 1rem">' +
        '<strong>Review</strong>' +
        [['all', 'All'], ['wrong', 'Incorrect'], ['flagged', 'Flagged']].map(function (f) {
          return '<button class="btn' + (filter === f[0] ? ' btn-primary' : '') +
            '" data-f="' + f[0] + '">' + f[1] + '</button>';
        }).join('') + '</div>' +
        (body || '<p class="hint">Nothing in this filter.</p>')
      );

      Array.prototype.forEach.call(document.querySelectorAll('[data-f]'), function (b) {
        b.addEventListener('click', function () {
          SN.view.reviewFilter = b.getAttribute('data-f');
          SN.Router.run();
        });
      });

      document.getElementById('again').addEventListener('click', function () {
        SN.view.pendingSettings = SN.Settings.load();
        SN.Router.go('exam');
      });
      document.getElementById('new-setup').addEventListener('click', function () {
        SN.Router.go('setup');
      });
      document.getElementById('leave').addEventListener('click', function () {
        SN.Router.go('home');
      });
    });

    SN.Router.add('history', function () {
      var list = SN.History.all();
      if (!list.length) {
        SN.UI.render('<h2>History</h2><p class="hint">No finished attempts yet.</p>');
        return;
      }
      SN.UI.render('<h2>History</h2><table><thead><tr><th>When</th><th>Score</th>' +
        '<th>Result</th><th>Questions</th><th>Time</th></tr></thead><tbody>' +
        list.map(function (a) {
          var passed = a.percent >= a.passPercent;
          return '<tr><td>' + new Date(a.at).toLocaleString() + '</td>' +
            '<td>' + a.percent.toFixed(1) + '%</td>' +
            '<td><span class="pill ' + (passed ? 'ok' : 'no') + '">' +
            (passed ? 'Pass' : 'Fail') + '</span></td>' +
            '<td>' + a.correct + ' / ' + a.total + '</td>' +
            '<td>' + (a.expired ? 'expired' : a.durationMinutes + ' min') + '</td></tr>';
        }).join('') + '</tbody></table>');
    });

    SN.Router.add('stats', function () {
      var rows = SN.Stats.rows();
      if (!rows.length) {
        SN.UI.render('<h2>Stats</h2><p class="hint">No answers recorded yet.</p>');
        return;
      }
      var answered = rows.reduce(function (n, r) { return n + r.seen; }, 0);
      var right = rows.reduce(function (n, r) { return n + r.correct; }, 0);
      SN.UI.render(
        '<h2>Stats</h2>' +
        '<div class="card"><p>' + rows.length + ' distinct questions seen, ' +
        answered + ' answers, ' + right + ' correct (' +
        (answered ? Math.round(right / answered * 100) : 0) + '%).</p>' +
        '<button class="btn" id="clear-stats">Clear stats</button></div>' +
        '<h2>Weakest first</h2><table><thead><tr><th>Question</th><th>Seen</th>' +
        '<th>Correct</th><th>Accuracy</th></tr></thead><tbody>' +
        rows.slice(0, 25).map(function (r) {
          var pct = Math.round(r.correct / r.seen * 100);
          return '<tr><td>' + SN.UI.escape(r.id) + '</td><td>' + r.seen + '</td><td>' +
            r.correct + '</td><td>' + pct + '%</td></tr>';
        }).join('') + '</tbody></table>'
      );
      document.getElementById('clear-stats').addEventListener('click', function () {
        if (window.confirm('Delete all per-question stats? History is kept.')) {
          SN.Stats.clear();
          SN.Router.run();
        }
      });
    });

    SN.Router.add('setup', function () {
      var s = SN.Settings.load();
      var max = SN.Questions.count();

      SN.UI.render(
        '<h2>New attempt</h2>' +
        '<label for="f-count">Questions</label>' +
        '<input type="number" id="f-count" min="1" max="' + max + '" value="' + s.questionCount + '">' +
        '<p class="hint">' + max + ' available. With shuffle off, the first N in file order are used.</p>' +
        '<label for="f-minutes">Minutes</label>' +
        '<input type="number" id="f-minutes" min="1" max="600" value="' + s.durationMinutes + '">' +
        '<label for="f-pass">Pass mark (%)</label>' +
        '<input type="number" id="f-pass" min="1" max="100" value="' + s.passPercent + '">' +
        '<div class="row" style="margin-top:1rem">' +
        '<label style="font-weight:400;margin:0">' +
        '<input type="checkbox" id="f-shuffle"' + (s.shuffle ? ' checked' : '') + '> Shuffle questions</label>' +
        '</div>' +
        '<p class="row" style="margin-top:1.25rem">' +
        '<button class="btn btn-primary" id="start">Begin</button> ' +
        '<button class="btn" id="cancel">Cancel</button></p>'
      );

      document.getElementById('cancel').addEventListener('click', function () {
        SN.Router.go('home');
      });

      document.getElementById('start').addEventListener('click', function () {
        var settings = {
          questionCount: Math.min(
            Math.max(1, parseInt(document.getElementById('f-count').value, 10) || 1), max),
          durationMinutes: Math.max(1, parseInt(document.getElementById('f-minutes').value, 10) || 1),
          shuffle: document.getElementById('f-shuffle').checked,
          passPercent: Math.min(100, Math.max(1,
            parseInt(document.getElementById('f-pass').value, 10) || SN.bank.exam.passPercent))
        };
        SN.Settings.save(settings);
        SN.view.pendingSettings = settings;
        SN.Router.go('exam');
      });
    });

    // Boot order matters. SN.bank first, because SN.Questions indexes lazily on
    // first get() (AGENTS.md rule 4). Restore before any route renders, so home
    // and the exam bar both know about a live attempt. Timer last, so it starts
    // exactly once. SN.Router.start() renders.
    SN.ExamSession.restore();

    // Started here rather than on the exam route so the clock is honest on every
    // view, and so an expired deadline auto-submits from any view.
    if (SN.ExamSession.has()) SN.ExamSession.startTimer(paintClock);

    SN.Router.start();
  }).catch(function (err) {
    SN.UI.render('<h2>Question bank unavailable</h2><pre style="white-space:pre-wrap">' +
                SN.UI.escape(err.message) + '</pre>');
  });

})();
</script>
</body>
</html>
